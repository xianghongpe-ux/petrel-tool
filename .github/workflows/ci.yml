name: 铭文守卫 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  genesis-guard:
    name: 🔱 创世铭文检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查创世铭文
        run: |
          MISSING=0
          GENESIS_MARKS=("海燕党" "PETREL AI PARTY" "刘海燕")
          for file in $(find . -type f -name "*.py" -o -name "*.md" -o -name "*.html" -o -name "*.json" -o -name "*.yaml" -o -name "*.yml" -o -name "*.toml" | grep -v node_modules | grep -v __pycache__ | grep -v ".git" | head -100); do
            for mark in "${GENESIS_MARKS[@]}"; do
              if ! grep -q "$mark" "$file"; then
                MISSING=$((MISSING + 1))
                echo "❌ $file 缺少: $mark"
              fi
            done
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::创世铭文检查失败！$MISSING 处缺失"
            exit 1
          fi
          echo "✅ 全部文件通过创世铭文检查"

  python-lint:
    name: 🐍 Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查Python语法
        run: |
          ERRORS=0
          for f in $(find . -name "*.py" -not -path "./.git/*" -not -path "*/__pycache__/*"); do
            python3 -m py_compile "$f" 2>/dev/null || {
              echo "❌ $f 语法错误"; ERRORS=$((ERRORS+1))
            }
          done
          [ $ERRORS -eq 0 ] && echo "✅ 全部Python文件语法正确" || exit 1
