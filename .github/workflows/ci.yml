name: CI — Petrel Tool 创世完整性检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  genesis-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行创世铭文完整性检查
        run: |
          python ci-cd/genesis-guard.py --ci

      - name: 代码结构检查
        run: |
          python ci-cd/genesis-guard.py --path . --ci
