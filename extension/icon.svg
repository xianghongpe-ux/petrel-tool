<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8edf5"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)" stroke="#2a3f6a" stroke-width="2"/>
  <!-- 海燕展翅 — 左侧翅膀 -->
  <path d="M64 72 C44 52, 28 48, 16 54 C22 58, 36 62, 64 72Z" fill="url(#wing)" opacity="0.95"/>
  <!-- 海燕展翅 — 右侧翅膀 -->
  <path d="M64 72 C84 52, 100 48, 112 54 C106 58, 92 62, 64 72Z" fill="url(#wing)" opacity="0.95"/>
  <!-- 海燕身体 -->
  <ellipse cx="64" cy="68" rx="10" ry="14" fill="#ffffff"/>
  <!-- 头部 -->
  <circle cx="64" cy="52" r="9" fill="#ffffff"/>
  <!-- 眼睛 -->
  <circle cx="61" cy="50" r="2.5" fill="#0d47a1"/>
  <circle cx="67" cy="50" r="2.5" fill="#0d47a1"/>
  <!-- 喙 -->
  <path d="M64 54 L60 58 L68 58 Z" fill="#fbbf24"/>
  <!-- 星 -->
  <text x="64" y="110" text-anchor="middle" font-size="10" fill="#fbbf24" font-family="sans-serif" font-weight="bold">PETREL</text>
</svg>
