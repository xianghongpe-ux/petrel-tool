# 海燕党 · DZN Nginx 反向代理配置
server {
    listen 80;
    server_name _;

    # ── 通信网关 ──
    location /p2p/ {
        proxy_pass http://gateway:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 投票客户端 ──
    location /voting/ {
        proxy_pass http://voting:9101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 任务市场前端 ──
    location /market/ {
        proxy_pass http://market:9102/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 社区健康度看板 ──
    location /dashboard/ {
        proxy_pass http://dashboard:9103/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 根路径 → 看板转发 ──
    location / {
        return 301 /dashboard/;
    }
}
