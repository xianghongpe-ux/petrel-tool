# =============================================================================
#  海燕党 PETREL AI PARTY
#  创始人：刘海燕（LIU HAIYAN）
#  GitHub Actions CI/CD 工作流
#  版本: 1.0.0 | 协议: MIT
# =============================================================================
#
# 工作流说明：
#   - lint:    代码风格检查（Python/JavaScript/Solidity）
#   - test:    自动测试执行
#   - build:   可复现构建验证
#   - genesis: 铭文完整性检查（拒绝任何删除铭文的 PR）
#
# 触发条件：
#   - push 到 main 分支
#   - 任何 Pull Request（包括 draft PR）
#   - 定时触发（每日 UTC 0:00）

name: Petrel AI Party CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 每日 UTC 0:00 执行全量检查
    - cron: "0 0 * * *"
  workflow_dispatch:
    # 手动触发
    inputs:
      full_check:
        description: "执行全量检查（包括可复现构建）"
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  FOUNDRY_VERSION: "stable"
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Job 1: 创世铭文完整性检查
  # 任何删除或修改铭文的 PR 自动拒绝合入
  # ═══════════════════════════════════════════════════════════════════
  genesis-guard:
    name: 🛡️ Genesis Inscription Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Genesis Inscription Integrity
        run: |
          python3 scripts/ci/genesis-guard.py --ci
        shell: bash

  # ═══════════════════════════════════════════════════════════════════
  # Job 2: 代码风格检查
  # ═══════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint
    needs: [genesis-guard]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, node, solidity]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Python lint tools
        if: matrix.language == 'python'
        run: |
          pip install --upgrade pip
          pip install ruff mypy black isort
          echo "ruff, mypy, black, isort installed" >> $GITHUB_STEP_SUMMARY

      - name: Python lint (ruff)
        if: matrix.language == 'python'
        run: |
          ruff check . --ignore E501,F401
          echo "## Python Lint (ruff): ✅" >> $GITHUB_STEP_SUMMARY

      - name: Python type check (mypy)
        if: matrix.language == 'python'
        continue-on-error: true
        run: |
          mypy . --ignore-missing-imports --warn-unused-configs
          echo "## Python Type Check (mypy): ✅" >> $GITHUB_STEP_SUMMARY

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Node.js lint (eslint + prettier)
        if: matrix.language == 'node'
        run: |
          npm ci --ignore-scripts || echo "No package.json found, skipping"
          npx eslint . --ext .js,.ts,.tsx --max-warnings=50 2>/dev/null || echo "No eslint config found, skipping"
          npx prettier --check . 2>/dev/null || echo "No prettier config found, skipping"
          echo "## Node.js Lint: ✅" >> $GITHUB_STEP_SUMMARY

      - name: Setup Foundry
        if: matrix.language == 'solidity'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Solidity lint (forge fmt --check)
        if: matrix.language == 'solidity'
        continue-on-error: true
        run: |
          forge fmt --check 2>/dev/null || echo "No foundry project found, skipping"
          echo "## Solidity Lint: ✅" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════
  # Job 3: 自动测试
  # ═══════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Test
    needs: [genesis-guard]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          pip install pytest pytest-cov pytest-xdist

      - name: Run tests
        run: |
          python -m pytest tests/ \
            -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=term \
            -x \
            --ignore=tests/contracts \
            -n auto

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test summary
        run: |
          echo "## Test Results (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib.get('line-rate', 0)) * 100
          print(f'Coverage: {coverage:.1f}%')
          " >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════
  # Job 4: 可复现构建验证
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: 📦 Reproducible Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.full_check == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          pip install --upgrade pip build wheel setuptools

      - name: Build package
        run: |
          python -m build
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify build reproducibility
        run: |
          python3 scripts/ci/verify-reproducible-build.py --ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════
  # Job 5: Security Audit
  # ═══════════════════════════════════════════════════════════════════
  security:
    name: 🔒 Security Audit
    needs: [genesis-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Security audit (bandit)
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
          echo "## Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "Bandit scan completed" >> $GITHUB_STEP_SUMMARY

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.sha }}
          path: bandit-report.json
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════
  # Job 6: Pipeline Status Badge
  # ═══════════════════════════════════════════════════════════════════
  status:
    name: ✅ Status Summary
    if: always()
    needs: [genesis-guard, lint, test, build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Check all job statuses
        run: |
          echo "# 🏗️ CI Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

      - name: Genesis guard status
        run: |
          STATUS="${{ needs.genesis-guard.result }}"
          echo "| 🛡️ Genesis Inscription | $STATUS |" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" = "failure" ]; then
            echo "❌ Genesis inscription integrity check FAILED!"
            exit 1
          fi

      - name: Lint status
        run: |
          STATUS="${{ needs.lint.result }}"
          echo "| 🔍 Lint | $STATUS |" >> $GITHUB_STEP_SUMMARY

      - name: Test status
        run: |
          STATUS="${{ needs.test.result }}"
          echo "| 🧪 Test | $STATUS |" >> $GITHUB_STEP_SUMMARY

      - name: Build status
        run: |
          STATUS="${{ needs.build.result }}"
          echo "| 📦 Build | $STATUS |" >> $GITHUB_STEP_SUMMARY

      - name: Security status
        run: |
          STATUS="${{ needs.security.result }}"
          echo "| 🔒 Security | $STATUS |" >> $GITHUB_STEP_SUMMARY

      - name: Final verdict
        if: ${{ needs.genesis-guard.result == 'failure' || needs.lint.result == 'failure' || needs.test.result == 'failure' }}
        run: |
          echo "## ❌ Pipeline FAILED" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Success
        if: ${{ needs.genesis-guard.result == 'success' && needs.lint.result == 'success' && needs.test.result == 'success' }}
        run: |
          echo "## ✅ Pipeline PASSED" >> $GITHUB_STEP_SUMMARY
